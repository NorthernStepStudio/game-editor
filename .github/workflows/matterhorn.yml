name: Matterhorn standalone checks
on:
  pull_request:
  push:
    branches: [master, 'feat/**']
jobs:
  deterministic-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
# Real Flyrail/Godot and visual PC acceptance are separate gates; no green skip substitutes for them.
