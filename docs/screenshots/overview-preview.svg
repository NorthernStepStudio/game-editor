  <text x="82" y="190" fill="#EDF2FF" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800">Build, rig, preview,</text>
  <text x="82" y="272" fill="#EDF2FF" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800">and export 2D</text>
  <text x="82" y="354" fill="#EDF2FF" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800">game motion.</text>
  <text x="84" y="418" fill="#B8C5E0" font-family="Inter, Arial, sans-serif" font-size="26">A focused browser-based editor for preparing 2D characters,</text>
  <text x="84" y="456" fill="#B8C5E0" font-family="Inter, Arial, sans-serif" font-size="26">organizing sprite assets, testing motion cycles, and exporting</text>
  <text x="84" y="494" fill="#B8C5E0" font-family="Inter, Arial, sans-serif" font-size="26">runtime-friendly animation data.</text>
