<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NStep Game Editor overview page preview</title>
  <desc id="desc">A dark professional landing screen for NStep Game Editor with product copy, action buttons, feature cards, and a stylized editor preview.</desc>
  <rect width="1440" height="900" fill="#0B0D14"/>
  <circle cx="180" cy="80" r="320" fill="#4C8EF5" opacity="0.18"/>
