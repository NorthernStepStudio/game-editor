<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Matterhorn — make game assets and change your game by describing what you want.">
  <title>Matterhorn</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="#studio">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20 10 7l4 7 2-3 5 9z"></path></svg>
        <span>Matterhorn</span>
      </a>
      <a class="nav" data-nav="studio" href="#studio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"></path></svg>Studio</a>
      <a class="nav" data-nav="game" href="#game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="4"></rect><path d="M8 11v3M6.5 12.5h3M15 12h.01M17 14h.01"></path></svg>My Game</a>
      <a class="nav" data-nav="assets" href="#assets">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5zM3 8v8l9 5 9-5V8"></path></svg>Assets</a>
      <a class="nav" data-nav="settings" href="#settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>Settings</a>
      <span class="spacer"></span>
      <button type="button" class="btn assistant-btn" id="assistant-toggle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.8L19 9.5l-5.2 1.7L12 16l-1.8-4.8L5 9.5l5.2-1.7z"></path></svg>Ask Matterhorn</button>
      <button type="button" class="setup-status" id="setup-status"><span class="dot off" aria-hidden="true"></span>Checking setup…</button>
    </nav>

    <main id="main" class="main" tabindex="-1"></main>

    <aside id="assistant" class="assistant" aria-label="Ask Matterhorn" hidden>
      <div class="row spread">
        <h2>Ask Matterhorn</h2>
        <button type="button" class="btn quiet" id="assistant-close" aria-label="Close assistant">✕</button>
      </div>
      <span class="context" id="assistant-context">Looking at: Studio</span>
      <div class="assistant-log" id="assistant-log" aria-live="polite">
        <p class="msg">Ask about whatever you're looking at — an asset, a change, a file, or how to do something.</p>
      </div>
      <label class="label" for="assistant-input">Message</label>
      <textarea id="assistant-input" class="field" rows="3" placeholder="Enter to send, Shift+Enter for a new line"></textarea>
      <button type="button" class="btn primary" id="assistant-send">Send</button>
    </aside>
  </div>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
