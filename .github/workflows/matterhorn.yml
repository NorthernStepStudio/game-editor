name: Matterhorn standalone checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: matterhorn-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
# Feature branches validate through their pull request so the same commit is not
# checked twice by both push and pull_request events. Newer commits cancel stale
# in-progress checks. Master still validates on direct pushes.
# Real Flyrail/Godot and visual PC acceptance remain separate gates.
