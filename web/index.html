<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matterhorn</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%230078d4' d='M3 12.8 8 2.8l5 10H3Z'/></svg>" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">

      <!-- Header -->
      <header class="header">
        <div class="header-brand">
          <svg class="brand-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 16 10 3l7 13H3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M10 8v5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <div class="brand-text">
            <span class="brand-name">Matterhorn</span>
            <span class="brand-sub">Northern Step Studio</span>
          </div>
        </div>
        <div class="header-status">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-label" id="status-label">Connecting…</span>
          <span class="mode-pill" id="mode-pill" hidden></span>
        </div>
      </header>

      <!-- Agent selector bar -->
      <div class="agent-bar">
        <button class="agent-tab is-active" data-agent-id="general" type="button">General</button>
        <button class="agent-tab" data-agent-id="stack-expert" type="button">Stack Expert</button>
        <button class="agent-tab" data-agent-id="architect" type="button">Architect</button>
        <button class="agent-tab" data-agent-id="workspace-ops" type="button">Workspace Ops</button>
        <button class="tools-trigger" id="tools-trigger" type="button" aria-expanded="false" title="Search codebase">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" width="13" height="13">
            <circle cx="6.5" cy="6.5" r="4" stroke="currentColor" stroke-width="1.3"/>
            <path d="M10 10 14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          Search
        </button>
      </div>

      <!-- Search panel (collapsible) -->
      <div class="search-panel" id="search-panel" hidden>
        <div class="search-inner">
          <input type="text" id="search-input" class="search-field" placeholder="Search codebase…" autocomplete="off" />
          <button id="search-btn" class="search-submit" type="button">Search</button>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>

      <!-- Conversation -->
      <div class="convo" id="convo">
        <div class="empty-state" id="empty-state">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
            <path d="M4 19 12 4l8 15H4Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M12 10v5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          <p>Ask Matterhorn anything about your workspace, code, or changes.</p>
        </div>
        <!-- messages injected here -->
      </div>

      <!-- Composer -->
      <div class="composer">
        <div class="composer-inner">
          <textarea
            id="prompt-input"
            class="composer-input"
            rows="1"
            placeholder="Ask Matterhorn…"
            aria-label="Prompt"
          ></textarea>
          <button class="composer-send" id="submit-button" type="button" aria-label="Send" title="Send (Enter)">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" width="14" height="14">
              <path d="M2 8 14 2l-4 12-2-5-6-1Zm7 1 1 3 2-7-7 2 3 1 1 1Z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <div class="composer-footer">
          <span class="composer-hint">Enter to send &middot; Shift+Enter for newline</span>
          <button class="foundation-btn" id="build-foundation-button" type="button" title="Build Foundation — get a workspace overview">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" width="11" height="11">
              <path d="M8 1.6 9.1 6.9 14.4 8 9.1 9.1 8 14.4 6.9 9.1 1.6 8l5.3-1.1L8 1.6Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
            Build Foundation
          </button>
        </div>
      </div>

    </div>

    <script src="/main.js"></script>
  </body>
</html>
