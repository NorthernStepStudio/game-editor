<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Matterhorn — make game assets and change your game by describing what you want.">
  <title>Matterhorn</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <nav class="sidebar" aria-label="Main">
      <button type="button" class="icon-btn nav-collapse" id="nav-collapse" aria-label="Hide the menu" title="Hide the menu">‹</button>
      <a class="brand" href="#studio" aria-label="Matterhorn — Studio"><span class="brand-word">MATTERHORN</span></a>
      <a class="nav" data-nav="studio" href="#studio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"></path></svg>Studio</a>
      <a class="nav" data-nav="game" href="#game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="4"></rect><path d="M8 11v3M6.5 12.5h3M15 12h.01M17 14h.01"></path></svg>My Game</a>
      <a class="nav" data-nav="assets" href="#assets">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5zM3 8v8l9 5 9-5V8"></path></svg>Assets</a>
      <a class="nav" data-nav="settings" href="#settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>Settings</a>
      <span class="spacer"></span>
      <button type="button" class="btn assistant-btn" id="assistant-toggle" aria-label="Open or minimize the Matterhorn chat">Matterhorn</button>
      <button type="button" class="setup-status" id="setup-status"><span class="dot off" aria-hidden="true"></span>Checking setup…</button>
    </nav>

    <main id="main" class="main" tabindex="-1"></main>

  </div>

  <button type="button" class="icon-btn nav-expand" id="nav-expand" aria-label="Show the menu" title="Show the menu" hidden>☰</button>

  <aside id="assistant" class="chat" role="dialog" aria-label="Matterhorn chat" hidden>
    <div class="chat-grip" id="chat-grip" title="Drag to resize" aria-hidden="true"></div>
    <div class="chat-head" id="chat-head" title="Drag to move · double-click to reset">
      <strong>Matterhorn</strong>
      <span class="context" id="assistant-context">Studio</span>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="assistant-dock" aria-label="Float the chat over the page" title="Float">⧉</button>
      <button type="button" class="icon-btn" id="assistant-clear" aria-label="Clear the conversation" title="Clear">⟲</button>
      <button type="button" class="icon-btn" id="assistant-min" aria-label="Minimize chat" title="Minimize">–</button>
      <button type="button" class="icon-btn" id="assistant-close" aria-label="Close chat" title="Close">✕</button>
    </div>
    <div class="chat-log" id="assistant-log" aria-live="polite"></div>
    <div class="chat-input">
      <label class="sr-only" for="assistant-input">Message</label>
      <textarea id="assistant-input" class="field" rows="2" placeholder="Message Matterhorn — Enter to send"></textarea>
      <button type="button" class="btn primary" id="assistant-send">Send</button>
    </div>
  </aside>
  <button type="button" id="chat-pill" class="chat-pill" hidden>Matterhorn chat</button>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
